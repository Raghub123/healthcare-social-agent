
name: Create healthcare content draft

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1,3,5'

permissions:
  contents: read

concurrency:
  group: healthcare-content-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install pillow

      - name: Generate healthcare content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          python generate.py

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-social-drafts
          path: drafts/
          if-no-files-found: error
          retention-days: 30

      - name: Workflow completed
        run: |
          echo "Content generation completed."
          echo "Download drafts from workflow artifacts."
